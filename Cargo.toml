[workspace]
resolver = "2"
members = ["core"] # gui re-added in TASK-014

[workspace.package]
edition = "2021"
rust-version = "1.74"
version = "0.1.0"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.11"
hmac = "0.13"
aes-gcm = "0.11"
argon2 = "0.5"
rayon = "1"
walkdir = "2"
yara-x = "1"
winreg = "0.56"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }
